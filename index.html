<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand-livre — Suivi de portefeuille crypto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10171b;
  --panel:#171f24;
  --panel-2:#1d272d;
  --border:#2b3941;
  --border-soft:#233039;
  --text:#e9e3d3;
  --text-dim:#8fa0a6;
  --text-faint:#5f7278;
  --accent:#c9a24b;
  --accent-soft:#3a3122;
  --positive:#74a98d;
  --positive-soft:#1c2a24;
  --negative:#c1614a;
  --negative-soft:#2c1f1c;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --sans:'Inter', system-ui, sans-serif;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
::selection{background:var(--accent-soft);color:var(--accent);}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}

.app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:216px;
  flex:none;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:22px 0;
}
.brand{
  padding:0 20px 22px 20px;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:14px;
}
.brand .mark{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  color:var(--accent);
}
.brand .name{
  font-size:16px;
  font-weight:600;
  margin-top:4px;
  color:var(--text);
}
nav.navlist{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
.navbtn{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border:none;
  background:transparent;
  color:var(--text-dim);
  border-radius:var(--radius);
  text-align:left;
  font-size:13.5px;
  font-weight:500;
}
.navbtn svg{width:16px;height:16px;flex:none;stroke:currentColor;}
.navbtn:hover{background:var(--panel-2);color:var(--text);}
.navbtn.active{background:var(--panel-2);color:var(--accent);}
.navbtn.active svg{stroke:var(--accent);}
.sidebar-foot{
  margin-top:auto;
  padding:14px 20px 0 20px;
  border-top:1px solid var(--border-soft);
}
.sidebar-foot .foot-row{
  display:flex;gap:8px;margin-top:10px;
}
.linklike{
  background:none;border:1px solid var(--border);color:var(--text-dim);
  padding:6px 9px;border-radius:var(--radius);font-size:11.5px;
}
.linklike:hover{border-color:var(--accent);color:var(--accent);}
.hint{font-size:11px;color:var(--text-faint);}

/* ---------- MAIN ---------- */
.content{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding:20px 30px;
  border-bottom:1px solid var(--border-soft);
  flex-wrap:wrap;
}
.topbar .valblock{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.topbar .totalval{
  font-family:var(--mono);
  font-size:30px;
  font-weight:500;
  letter-spacing:-.01em;
}
.chip{
  font-family:var(--mono);
  font-size:12.5px;
  padding:3px 8px;
  border-radius:20px;
  border:1px solid var(--border);
}
.chip.pos{color:var(--positive);border-color:#2c4438;background:var(--positive-soft);}
.chip.neg{color:var(--negative);border-color:#43291f;background:var(--negative-soft);}
.chip.neutral{color:var(--text-dim);}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.btn{
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text);
  padding:8px 13px;
  border-radius:var(--radius);
  font-size:13px;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn:hover{border-color:var(--text-dim);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1408;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;}
.btn.small{padding:5px 9px;font-size:12px;}
.btn svg{width:14px;height:14px;stroke:currentColor;}
.btn:disabled{opacity:.45;cursor:default;}

main .view{display:none;padding:26px 30px 60px 30px;}
main .view.active{display:block;}

.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.section-head h1{font-size:18px;margin:0;font-weight:600;}
.section-head p.sub{margin:2px 0 0 0;color:var(--text-dim);font-size:12.5px;}

/* cards */
.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1.1fr 1fr;}
.card{
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:18px 20px;
}
.card h3{margin:0 0 12px 0;font-size:12px;text-transform:none;color:var(--text-dim);font-weight:600;letter-spacing:.02em;}

/* allocation bars */
.alloc-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--panel-2);margin-bottom:12px;}
.alloc-seg{height:100%;}
.alloc-legend{display:flex;flex-direction:column;gap:8px;}
.alloc-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
.alloc-row .lbl{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}
.alloc-row .amt{font-family:var(--mono);color:var(--text);}

/* chart */
.chart-wrap{width:100%;}
.chart-empty{color:var(--text-faint);font-size:13px;padding:30px 0;text-align:center;}

/* movers */
.movers{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.mover-list{display:flex;flex-direction:column;gap:8px;}
.mover-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border-soft);}
.mover-row:last-child{border-bottom:none;}
.mover-name{color:var(--text);}
.mover-sym{color:var(--text-faint);font-family:var(--mono);font-size:11px;margin-left:5px;}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-weight:500;color:var(--text-faint);
  font-size:11px;letter-spacing:.03em;
  padding:10px 14px;border-bottom:1px solid var(--border-soft);
  white-space:nowrap;background:var(--panel-2);
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.015);}
td.num,th.num{font-family:var(--mono);text-align:right;}
.asset-cell{display:flex;flex-direction:column;}
.asset-cell .aname{color:var(--text);font-weight:500;}
.asset-cell .asym{color:var(--text-faint);font-family:var(--mono);font-size:11px;}
.sector-tag{
  font-size:11px;color:var(--text-dim);background:var(--panel-2);
  border:1px solid var(--border-soft);padding:2px 7px;border-radius:20px;
  white-space:nowrap;
}
.pos{color:var(--positive);}
.neg{color:var(--negative);}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.icon-btn{
  border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);
  width:26px;height:26px;border-radius:var(--radius);display:inline-flex;
  align-items:center;justify-content:center;
}
.icon-btn:hover{color:var(--text);border-color:var(--text-dim);}
.icon-btn svg{width:13px;height:13px;stroke:currentColor;}
.desc-row td{background:var(--panel-2);color:var(--text-dim);font-size:12.5px;line-height:1.6;padding:12px 14px 16px 14px;white-space:normal;}
.desc-row .desc-note{color:var(--text-faint);font-size:11px;margin-top:6px;}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--text-faint);font-size:13px;
}
.empty-state .btn{margin-top:14px;}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(8,11,13,.72);
  display:flex;align-items:flex-start;justify-content:center;
  padding:6vh 20px;z-index:50;overflow-y:auto;
}
.modal-overlay.hidden{display:none;}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  width:100%;max-width:480px;padding:22px 24px 24px 24px;
}
.modal h2{margin:0 0 4px 0;font-size:16px;}
.modal p.sub{margin:0 0 16px 0;color:var(--text-dim);font-size:12.5px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:9px 10px;border-radius:var(--radius);font-size:13.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

.search-results{
  border:1px solid var(--border);border-radius:var(--radius);margin-top:6px;
  max-height:220px;overflow-y:auto;background:var(--bg);
}
.search-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--border-soft);
  font-size:13px;
}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--panel-2);}
.search-item img{width:18px;height:18px;border-radius:50%;}
.search-item .sname{color:var(--text);}
.search-item .ssym{color:var(--text-faint);font-family:var(--mono);font-size:11px;}
.search-status{font-size:12px;color:var(--text-faint);padding:6px 2px;}

.selected-asset{
  display:flex;gap:10px;align-items:flex-start;background:var(--bg);
  border:1px solid var(--border-soft);border-radius:var(--radius);padding:11px 12px;margin-top:8px;
}
.selected-asset img{width:26px;height:26px;border-radius:50%;margin-top:1px;}
.selected-asset .sa-name{font-weight:600;font-size:13.5px;}
.selected-asset .sa-sector{font-size:11px;color:var(--accent);margin:3px 0 6px 0;}
.selected-asset .sa-desc{font-size:12px;color:var(--text-dim);line-height:1.55;}
.selected-asset .sa-price{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);margin-top:6px;}

.manual-toggle{font-size:11.5px;color:var(--text-faint);margin-top:8px;text-align:right;}
.manual-toggle a{color:var(--accent);cursor:pointer;text-decoration:none;}

.foot-disclaimer{
  padding:18px 30px 30px 30px;color:var(--text-faint);font-size:11.5px;
}

@media (max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;align-items:center;padding:12px 14px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);}
  .brand{display:none;}
  nav.navlist{flex-direction:row;padding:0;}
  .sidebar-foot{display:none;}
  .grid.cols-2{grid-template-columns:1fr;}
  .movers{grid-template-columns:1fr;}
  .topbar{padding:16px 18px;}
  main .view{padding:18px 16px 50px 16px;}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">GRAND-LIVRE</div>
      <div class="name">Portefeuille crypto</div>
    </div>
    <nav class="navlist" id="navlist">
      <button class="navbtn active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v4h6V4h-6Z"/></svg>
        Tableau de bord
      </button>
      <button class="navbtn" data-view="spot">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M3 7h18M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7M3 7l3-4h12l3 4M15 12a2 2 0 1 1 4 0 2 2 0 0 1-4 0Z"/></svg>
        Portefeuille
      </button>
      <button class="navbtn" data-view="earn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 2v6M12 22v-6M4.9 4.9l4.2 4.2M14.9 14.9l4.2 4.2M2 12h6M16 12h6M4.9 19.1l4.2-4.2M14.9 9.1l4.2-4.2"/></svg>
        Earn
      </button>
      <button class="navbtn" data-view="grids">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Grilles OKX
      </button>
      <button class="navbtn" data-view="gridsperp">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg>
        Grilles perp OKX
      </button>
    </nav>
    <div class="sidebar-foot">
      <div class="hint">Sauvegarde locale</div>
      <div class="foot-row">
        <button class="linklike" id="btn-export">Exporter</button>
        <button class="linklike" id="btn-import">Importer</button>
      </div>
      <div class="foot-row">
        <button class="linklike" id="btn-reset">Réinitialiser</button>
      </div>
      <input type="file" id="import-file" accept="application/json" style="display:none;">
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <div class="valblock">
        <div>
          <div class="hint" style="margin-bottom:4px;">Valeur totale</div>
          <div class="totalval" id="total-value">€0.00</div>
        </div>
        <span class="chip neutral" id="total-chip">—</span>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" id="btn-refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
          Actualiser les prix
        </button>
      </div>
    </div>

    <main>
      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-spot"></section>
      <section class="view" id="view-earn"></section>
      <section class="view" id="view-grids"></section>
      <section class="view" id="view-gridsperp"></section>
    </main>

    <div class="foot-disclaimer">Prix et données de marché fournis par l'API publique CoinGecko. Outil de suivi personnel — ne constitue pas un conseil en investissement.</div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
'use strict';

/* ============================= STATE ============================= */
const STORAGE_KEY = 'grandlivre_crypto_v1';
const CATEGORY_FR = {
  "Smart Contract Platform":"Plateforme de contrats intelligents",
  "Layer 1 (L1)":"Blockchain de couche 1",
  "Layer 2 (L2)":"Blockchain de couche 2",
  "Decentralized Finance (DeFi)":"Finance décentralisée (DeFi)",
  "Stablecoins":"Stablecoin",
  "Exchange-based Tokens":"Token de plateforme d'échange",
  "Meme":"Memecoin",
  "Oracle":"Oracle",
  "Gaming (GameFi)":"Jeu vidéo (GameFi)",
  "Non-Fungible Tokens (NFT)":"NFT",
  "Privacy Coins":"Confidentialité",
  "Payments":"Paiement",
  "Interoperability":"Interopérabilité",
  "Storage":"Stockage décentralisé",
  "Yield Farming":"Yield farming",
  "Liquid Staking Tokens":"Staking liquide",
  "Liquid Staking":"Staking liquide",
  "Real World Assets (RWA)":"Actifs du monde réel (RWA)",
  "Artificial Intelligence (AI)":"Intelligence artificielle (IA)",
  "Wrapped-Tokens":"Token wrappé",
  "Centralized Exchange (CEX) Token":"Token d'échange centralisé",
  "Data Availability":"Disponibilité des données"
};

let memoryFallback = null;
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  if(memoryFallback) return memoryFallback;
  return { spot:[], earn:[], grids:[], gridsPerp:[], history:[] };
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    memoryFallback = state;
  }
}
let state = loadState();
for(const k of ['spot','earn','grids','gridsPerp','history']) if(!state[k]) state[k]=[];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ============================= FORMAT HELPERS ============================= */
const fmtEUR = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const fmtEURprecise = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:6});
function money(v){ if(v===null||v===undefined||isNaN(v)) return '—'; return fmtEUR.format(v); }
function moneyPrecise(v){ if(v===null||v===undefined||isNaN(v)) return '—'; return Math.abs(v)<1 ? fmtEURprecise.format(v) : fmtEUR.format(v); }
function pct(v){ if(v===null||v===undefined||isNaN(v)) return '—'; const s=v>0?'+':''; return s+v.toFixed(2)+'%'; }
function qty(v){ if(v===null||v===undefined||isNaN(v)) return '—'; return v.toLocaleString('fr-FR',{maximumFractionDigits:8}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= DERIVED VALUES ============================= */
function spotValue(a){ return (a.quantity||0) * (a.currentPrice||0); }
function spotCost(a){ return (a.quantity||0) * (a.avgPrice||0); }
function spotPnL(a){ return spotValue(a) - spotCost(a); }
function spotPnLPct(a){ const c=spotCost(a); return c>0 ? (spotPnL(a)/c*100) : null; }

function earnDays(e){
  const start = new Date(e.startDate || todayStr());
  const ms = Date.now() - start.getTime();
  return Math.max(0, ms/(1000*3600*24));
}
function earnAccrued(e){
  const days = earnDays(e);
  const apy = (e.apy||0)/100;
  return (e.quantity||0) * apy * (days/365);
}
function earnEffectiveQty(e){ return (e.quantity||0) + earnAccrued(e); }
function earnValue(e){ return earnEffectiveQty(e) * (e.currentPrice||0); }

function gridPnL(g){ return (g.currentValue||0) - (g.invested||0); }
function gridPnLPct(g){ return (g.invested||0)>0 ? (gridPnL(g)/g.invested*100) : null; }

function totalSpot(){ return state.spot.reduce((s,a)=>s+spotValue(a),0); }
function totalEarn(){ return state.earn.reduce((s,e)=>s+earnValue(e),0); }
function totalGrids(){ return state.grids.reduce((s,g)=>s+(g.currentValue||0),0); }
function totalGridsPerp(){ return state.gridsPerp.reduce((s,g)=>s+(g.currentValue||0),0); }
function grandTotal(){ return totalSpot()+totalEarn()+totalGrids()+totalGridsPerp(); }

function spot24hDelta(){
  // weighted 24h change contribution in € across spot holdings
  let delta = 0;
  for(const a of state.spot){
    if(a.change24h!==undefined && a.change24h!==null){
      const val = spotValue(a);
      const prevVal = val / (1+ (a.change24h/100));
      delta += (val - prevVal);
    }
  }
  return delta;
}

/* ============================= COINGECKO API ============================= */
const CG_BASE = 'https://api.coingecko.com/api/v3';

async function cgSearch(query){
  const res = await fetch(`${CG_BASE}/search?query=${encodeURIComponent(query)}`);
  if(!res.ok) throw new Error('search failed');
  const data = await res.json();
  return (data.coins||[]).slice(0,8);
}

async function cgCoinDetail(id){
  const res = await fetch(`${CG_BASE}/coins/${id}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false&sparkline=false`);
  if(!res.ok) throw new Error('detail failed');
  return res.json();
}

async function cgSimplePrice(ids){
  if(!ids.length) return {};
  const res = await fetch(`${CG_BASE}/simple/price?ids=${ids.join(',')}&vs_currencies=eur&include_24hr_change=true`);
  if(!res.ok) throw new Error('price failed');
  return res.json();
}

function buildDescriptionFr(detail){
  const raw = (detail.description && (detail.description.fr || detail.description.en)) || '';
  const isEnglish = !(detail.description && detail.description.fr);
  let text = raw.replace(/<[^>]*>/g,'').trim();
  const sentences = text.split(/(?<=[.!?])\s+/).filter(Boolean);
  text = sentences.slice(0,3).join(' ');
  if(text.length>420) text = text.slice(0,420).trim()+'…';
  return { text: text || 'Aucune description disponible.', isEnglish };
}
function buildSector(detail){
  const cats = (detail.categories||[]).filter(Boolean);
  for(const c of cats){ if(CATEGORY_FR[c]) return CATEGORY_FR[c]; }
  return cats[0] || 'Non classé';
}

/* ============================= RENDER: SHELL / NAV ============================= */
const views = ['dashboard','spot','earn','grids','gridsperp'];
document.getElementById('navlist').addEventListener('click', e=>{
  const btn = e.target.closest('.navbtn');
  if(!btn) return;
  setView(btn.dataset.view);
});

function renderHistoryChart(container){
  const hist = state.history;
  if(!hist || hist.length<2){
    container.innerHTML = `<div class="chart-empty">Pas encore assez de données. L'historique se construit à chaque actualisation des prix (un point par jour).</div>`;
    return;
  }
  const w = Math.max(container.clientWidth || 600, 300);
  const h = 200;
  const padL=50, padR=14, padT=14, padB=26;
  const values = hist.map(p=>p.total);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const stepX = (w-padL-padR) / (hist.length-1);
  const pts = hist.map((p,i)=>{
    const x = padL + i*stepX;
    const y = padT + (1 - (p.total-min)/range) * (h-padT-padB);
    return [x,y];
  });
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${h-padB} L${pts[0][0].toFixed(1)},${h-padB} Z`;
  const first = hist[0].date, last = hist[hist.length-1].date;

  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c9a24b" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#c9a24b" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#2b3941"/>
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#2b3941"/>
    <text x="4" y="${padT+8}" fill="#5f7278" font-size="10" font-family="IBM Plex Mono">${money(max)}</text>
    <text x="4" y="${h-padB}" fill="#5f7278" font-size="10" font-family="IBM Plex Mono">${money(min)}</text>
    <path d="${area}" fill="url(#areaFill)"/>
    <path d="${line}" fill="none" stroke="#c9a24b" stroke-width="1.8"/>
    <text x="${padL}" y="${h-6}" fill="#5f7278" font-size="10" font-family="IBM Plex Mono">${first}</text>
    <text x="${w-padR}" y="${h-6}" fill="#5f7278" font-size="10" font-family="IBM Plex Mono" text-anchor="end">${last}</text>
  </svg>`;
}

    pendingCoin = {

  const quantity = parseFloat(document.getElementById('f-quantity').value) || 0;
  const second = parseFloat(document.getElementById('f-second').value) || 0;

  if(kind==='spot'){
    state.spot.push({
      id: uid(), cgId: pendingCoin.id, name: pendingCoin.name, symbol: pendingCoin.symbol,
      sector: pendingCoin.sector, description: pendingCoin.description, descIsEnglish: pendingCoin.descIsEnglish,
      quantity, avgPrice: second, currentPrice: pendingCoin.price, change24h: pendingCoin.change24h
    });
  } else {
    const platform = document.getElementById('f-platform')?.value || '';
    const startDate = document.getElementById('f-startdate')?.value || todayStr();
    state.earn.push({
      id: uid(), cgId: pendingCoin.id, name: pendingCoin.name, symbol: pendingCoin.symbol,
      quantity, apy: second, platform, startDate, currentPrice: pendingCoin.price
    });
  }
  saveState();
  closeModal();
  renderAll();
}

function openEditAssetModal(kind, id){
  const isEarn = kind==='earn';
  const item = state[kind].find(x=>x.id===id);
  if(!item) return;
  modal.innerHTML = `
    <h2>Modifier ${escapeHtml(item.name)}</h2>
    <p class="sub">${escapeHtml(item.sector||'')}</p>
    <div class="field-row">
      <div class="field"><label>Quantité détenue</label><input type="number" step="any" id="e-quantity" value="${item.quantity}"></div>
      <div class="field"><label>${isEarn?'APY (%)':"Prix moyen d'achat (€)"}</label><input type="number" step="any" id="e-second" value="${isEarn?item.apy:item.avgPrice}"></div>
    </div>
    ${isEarn ? `<div class="field"><label>Plateforme</label><input type="text" id="e-platform" value="${escapeHtml(item.platform||'')}"></div>` : ''}
    ${isEarn ? `<div class="field"><label>Date de début</label><input type="date" id="e-startdate" value="${item.startDate||todayStr()}"></div>` : ''}
    <div class="field"><label>Prix actuel (€)</label><input type="number" step="any" id="e-price" value="${item.currentPrice||0}"></div>
    <div class="field"><label>Identifiant CoinGecko (optionnel)</label><input type="text" id="e-cgid" value="${item.cgId||''}" placeholder="ex. bitcoin, ethereum…"></div>
    <div class="hint" style="margin:-6px 0 4px 0;">Renseigné, il permet l'actualisation automatique du prix.</div>
    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel">Annuler</button>
      <button class="btn primary" id="modal-save-edit">Enregistrer</button>
    </div>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save-edit').addEventListener('click', ()=>{
    item.quantity = parseFloat(document.getElementById('e-quantity').value)||0;
    if(isEarn){
      item.apy = parseFloat(document.getElementById('e-second').value)||0;
      item.platform = document.getElementById('e-platform').value||'';
      item.startDate = document.getElementById('e-startdate').value||todayStr();
    } else {
      item.avgPrice = parseFloat(document.getElementById('e-second').value)||0;
    }
    item.currentPrice = parseFloat(document.getElementById('e-price').value)||0;
    item.cgId = document.getElementById('e-cgid').value.trim() || item.cgId || null;
    saveState(); closeModal(); renderAll();
  });
}

/* ============================= MODAL: GRID (spot + perp) ============================= */
function openGridModal(kind, id){
  const isPerp = kind==='gridsPerp';
  const editing = id ? state[kind].find(g=>g.id===id) : null;
  modal.innerHTML = `
    <h2>${editing?'Modifier la grille':'Ajouter une grille '+(isPerp?'perp OKX':'OKX')}</h2>
    <div class="field"><label>Paire</label><input type="text" id="g-pair" placeholder="ex. BTC/USDT" value="${editing?escapeHtml(editing.pair):''}"></div>
    <div class="field-row">
      <div class="field"><label>Investi (€)</label><input type="number" step="any" id="g-invested" value="${editing?editing.invested:''}"></div>
      <div class="field"><label>Valeur actuelle (€)</label><input type="number" step="any" id="g-value" value="${editing?editing.currentValue:''}"></div>
    </div>
    ${isPerp?`<div class="field-row">
      <div class="field"><label>Levier</label><input type="number" step="any" id="g-leverage" placeholder="ex. 3" value="${editing?editing.leverage:''}"></div>
      <div class="field"><label>Direction</label>
        <select id="g-direction">
          <option value="Neutre" ${editing?.direction==='Neutre'?'selected':''}>Neutre</option>
          <option value="Long" ${editing?.direction==='Long'?'selected':''}>Long</option>
          <option value="Short" ${editing?.direction==='Short'?'selected':''}>Short</option>
        </select>
      </div>
    </div>`:''}
    <div class="field"><label>Statut</label>
      <select id="g-status">
        <option value="Active" ${editing?.status==='Active'?'selected':''}>Active</option>
        <option value="En pause" ${editing?.status==='En pause'?'selected':''}>En pause</option>
        <option value="Clôturée" ${editing?.status==='Clôturée'?'selected':''}>Clôturée</option>
      </select>
    </div>
    <div class="field"><label>Date de début</label><input type="date" id="g-startdate" value="${editing?.startDate||todayStr()}"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel">Annuler</button>
      <button class="btn primary" id="modal-save-grid">${editing?'Enregistrer':'Ajouter'}</button>
    </div>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save-grid').addEventListener('click', ()=>{
    const obj = editing || { id: uid() };
    obj.pair = document.getElementById('g-pair').value.trim() || 'Paire';
    obj.invested = parseFloat(document.getElementById('g-invested').value)||0;
    obj.currentValue = parseFloat(document.getElementById('g-value').value)||0;
    obj.status = document.getElementById('g-status').value;
    obj.startDate = document.getElementById('g-startdate').value || todayStr();
    if(isPerp){
      obj.leverage = parseFloat(document.getElementById('g-leverage').value)||1;
      obj.direction = document.getElementById('g-direction').value;
    }
    if(!editing) state[kind].push(obj);
    saveState(); closeModal(); renderAll();
  });
}

/* ============================= REFRESH PRICES ============================= */
document.getElementById('btn-refresh').addEventListener('click', refreshPrices);
async function refreshPrices(){
  const btn = document.getElementById('btn-refresh');
  const ids = new Set();
  state.spot.forEach(a=>{ if(a.cgId) ids.add(a.cgId); });
  state.earn.forEach(e=>{ if(e.cgId) ids.add(e.cgId); });
  if(ids.size===0){
    snapshotHistory();
    renderAll();
    return;
  }
  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = 'Actualisation…';
  try{
    const prices = await cgSimplePrice([...ids]);
    state.spot.forEach(a=>{
      if(a.cgId && prices[a.cgId]){
        a.currentPrice = prices[a.cgId].eur;
        a.change24h = prices[a.cgId].eur_24h_change;
      }
    });
    state.earn.forEach(e=>{
      if(e.cgId && prices[e.cgId]){
        e.currentPrice = prices[e.cgId].eur;
      }
    });
    saveState();
    snapshotHistory();
    renderAll();
  }catch(err){
    alert("Impossible d'actualiser les prix (connexion internet ou API indisponible). Réessayez plus tard.");
  }finally{
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

function snapshotHistory(){
  const total = grandTotal();
  const today = todayStr();
  const idx = state.history.findIndex(h=>h.date===today);
  if(idx>=0) state.history[idx].total = total;
  else state.history.push({date:today, total});
  if(state.history.length>90) state.history = state.history.slice(-90);
  saveState();
}

/* ============================= EXPORT / IMPORT / RESET ============================= */
document.getElementById('btn-export').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `portefeuille-crypto-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});
document.getElementById('btn-import').addEventListener('click', ()=>{
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      for(const k of ['spot','earn','grids','gridsPerp','history']) if(!data[k]) data[k]=[];
      state = data;
      saveState();
      renderAll();
    }catch(err){
      alert("Fichier invalide.");
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
document.getElementById('btn-reset').addEventListener('click', ()=>{
  if(confirm('Réinitialiser toutes les données du portefeuille ? Cette action est irréversible.')){
    state = { spot:[], earn:[], grids:[], gridsPerp:[], history:[] };
    saveState();
    renderAll();
  }
});

/* ============================= INIT ============================= */
snapshotHistory();
renderAll();
</script>
